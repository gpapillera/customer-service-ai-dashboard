# ───────────────────────────────────────────────────────────────
# CI Pipeline — Customer Service AI Dashboard
#
# Three jobs, gated so cheap tests run on every PR/push and the heavy
# SQL Server boot runs only where regressions actually land:
#   1) backend       — dotnet build + test (xUnit, 141 tests; EF Core
#                      InMemory fakes). Fast, every PR + push.
#   2) frontend      — npm ci + ng build (prod) + ng test (headless
#                      Chrome, 47 spec cases). Every PR + push.
#   3) integration   — docker compose up --build (SQL Server + API +
#                      SPA), then prove the SQL Server seed survived by
#                      polling /api/cases until it returns 401 (auth wall
#                      up) and a login returns 200. This is the ONLY job
#                      that exercises the real SQL Server path, so it
#                      catches regressions like the EmailConfig pinned-Id=1
#                      seed crash that InMemory tests cannot see. Gated on
#                      the two test jobs; runs on push to main + manual
#                      dispatch only (SQL Server image pull is ~1.5 GB).
#
# The compose file supplies a DEV-ONLY Jwt__Key; this is a smoke test,
# not production. Never reuse that key for a real deployment.
# ───────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend (.NET 8) ───────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests (141 xUnit tests)
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx
          retention-days: 14

  # ── Frontend (Angular 18) ─────────────────────────────────
  frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Install headless Chrome explicitly — do not rely on a runner-
      # preinstalled binary at a hardcoded path (it can be absent on
      # newer images). The karma config's ChromeHeadlessCI launcher adds
      # --no-sandbox, which is required for root-in-container runs.
      - name: Install Chrome (headless)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Run unit tests (headless Chrome, 47 spec cases)
        run: npx ng test --watch=false --browsers ChromeHeadlessCI
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

  # ── Integration (Docker stack: SQL Server + API + SPA) ─────
  integration:
    name: Docker stack e2e (SQL Server seed + API smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Heavy SQL Server pull: only on main push (where regressions land)
    # or a manual dispatch — not on every fork PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & start stack
        run: docker compose up -d --build db backend frontend

      - name: Wait for API (auth wall = 401 proves SQL Server seed survived)
        timeout-minutes: 20
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/cases || true)
            if [ "$code" = "401" ]; then
              echo "API up after ~$((i*10))s (auth wall returned 401 — SQL Server seed OK)"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for API. Backend logs:" >&2
          docker compose logs backend >&2
          exit 1

      - name: Smoke — staff login returns 200 + JWT
        run: |
          code=$(curl -s -o /tmp/login.json -w "%{http_code}" -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Passw0rd!"}')
          echo "POST /api/auth/login -> $code"
          test "$code" = "200"

      - name: Tear down
        if: always()
        run: docker compose down -v
