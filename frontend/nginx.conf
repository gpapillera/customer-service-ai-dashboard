server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + Swagger are served by the backend; proxy them through.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (Development env). Prefix match so both the bare /swagger
    # redirect and /swagger/* (incl. swagger.json) reach the backend.
    location /swagger {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: route all other non-asset requests to index.html.
    # This MUST come after /api/ and /swagger/ so those prefixes win.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
