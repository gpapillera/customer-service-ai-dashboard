<form class="toolbar" [formGroup]="form" aria-label="Search and filter cases">
  <div class="f-search-wrapper">
    <mat-form-field appearance="outline" class="f-search">
      <cs-icon name="search" matPrefix class="prefix-icon"></cs-icon>
      <input
        matInput
        formControlName="search"
        placeholder="Search by title or customer..."
        aria-label="Search by title or customer"
      />
    </mat-form-field>
    @if (form.get('search')?.value) {
      <button
        type="button"
        class="search-reset-btn"
        (click)="clearSearch()"
        aria-label="Clear search"
        title="Clear search"
      >
        <cs-icon name="close" [size]="12"></cs-icon>
      </button>
    }
  </div>

  <div class="filters">
    <button
      type="button"
      class="tb-toggle ai-toggle"
      [class.active]="aiActive"
      (click)="aiToggled.emit()"
      [attr.aria-pressed]="aiActive"
    >
      <cs-icon name="auto_awesome" [size]="16"></cs-icon>
      <span>AI Predicted</span>
    </button>

    <button
      type="button"
      class="tb-toggle overdue-toggle"
      [class.active]="overdueActive"
      (click)="overdueToggled.emit()"
      [attr.aria-pressed]="overdueActive"
    >
      <cs-icon name="schedule" [size]="16"></cs-icon>
      <span>Overdue</span>
    </button>
  </div>
</form>
